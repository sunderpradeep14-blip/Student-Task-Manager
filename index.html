<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-content">
        <h1>🎓 Student Task Manager</h1>
        <p>Organize your academic tasks and stay productive.</p>
    </div>
</header>

<main class="container">
    <section class="dashboard">
        <div class="stat-card"><h3>Total Tasks</h3><span id="totalTasks">0</span></div>
        <div class="stat-card"><h3>Pending</h3><span id="pendingTasks">0</span></div>
        <div class="stat-card"><h3>Completed</h3><span id="completedTasks">0</span></div>
        <div class="stat-card"><h3>High Priority</h3><span id="highTasks">0</span></div>
    </section>

    <section class="task-form-section">
        <h2 id="formTitle">Add New Task</h2>
        <form id="taskForm">
            <input type="hidden" id="taskId">
            <div class="form-row">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Enter task description"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Pending" selected>Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn primary" id="submitBtn">Add Task</button>
                <button type="button" class="btn secondary" onclick="cancelEdit()">Clear</button>
            </div>
        </form>
    </section>

    <section class="task-section">
        <div class="task-header">
            <h2>My Tasks</h2>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 Search tasks...">
                <select id="filterStatus">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="filterPriority">
                    <option value="All">All Priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>
        <div id="taskList"></div>
        <div id="emptyMessage" class="empty-message">
            <h3>📋 No tasks found</h3>
            <p>Add a new task to get started.</p>
        </div>
    </section>
</main>

<footer>
    <p>Student Task Manager | VSB Skill Vault Activity 3</p>
</footer>
<script src="script.js"></script>
</body>
</html>
